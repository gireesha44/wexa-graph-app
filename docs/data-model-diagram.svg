<svg width="820" height="520" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Warm Intro Finder graph data model</title>
<desc>Person nodes connect to College via STUDIED_AT, to Company via WORKS_AT, to Skill via HAS_SKILL, and to other Person nodes via KNOWS.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9Z" fill="#4b5563"/>
  </marker>
</defs>

<rect width="820" height="520" fill="#ffffff"/>

<!-- College box -->
<rect x="40" y="60" width="180" height="70" rx="10" fill="#fdecdb" stroke="#c98a33" stroke-width="1.5"/>
<text x="130" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5c3a0a">College</text>
<text x="130" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7a5215">name</text>

<!-- Company box -->
<rect x="600" y="60" width="180" height="70" rx="10" fill="#dff3ea" stroke="#2f9e6d" stroke-width="1.5"/>
<text x="690" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1b5e42">Company</text>
<text x="690" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#256e4f">name, industry</text>

<!-- Skill box -->
<rect x="320" y="400" width="180" height="70" rx="10" fill="#eee6fb" stroke="#8b5fbf" stroke-width="1.5"/>
<text x="410" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4b2d73">Skill</text>
<text x="410" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f3a91">name</text>

<!-- Person box (center) -->
<rect x="320" y="215" width="180" height="80" rx="10" fill="#e3edfb" stroke="#3b74c4" stroke-width="2"/>
<text x="410" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1c3e6e">Person</text>
<text x="410" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2a4d80">name, role</text>

<!-- Person -> College : STUDIED_AT -->
<line x1="355" y1="222" x2="185" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="230" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">STUDIED_AT</text>

<!-- Person -> Company : WORKS_AT -->
<line x1="465" y1="222" x2="635" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="595" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">WORKS_AT {role}</text>

<!-- Person -> Skill : HAS_SKILL -->
<line x1="410" y1="295" x2="410" y2="398" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">HAS_SKILL</text>

<!-- Person self-loop : KNOWS -->
<path d="M498 235 C 590 200, 590 300, 500 275" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#c0392b">KNOWS {context}</text>
<text x="600" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8a4a42">(bidirectional)</text>

<text x="410" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Warm Intro Finder — graph data model</text>
</svg>
